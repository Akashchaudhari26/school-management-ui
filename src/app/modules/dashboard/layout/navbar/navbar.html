<nav class="navbar">
    <div class="navbar-left">
        <button class="icon-btn hamburger-btn" (click)="onToggleMobile()">
            <i class="bi bi-list"></i>
        </button>
        <span class="brand-name">Matrutva Little Buds</span>
    </div>

    <div class="navbar-right" *ngIf="user$ | async as user">

        <div class="user-info">
            <span class="user-name">{{ user.fullName?.toLocaleUpperCase() }}</span>
            <span class="user-role">{{ user.roleName }}</span>
        </div>

        <div class="avatar">
            @if (user.profileImageUrl) {
            <img [src]="user.profileImageUrl" alt="User">
            } @else {
            <div class="avatar-initials">
                {{ getInitials(user.fullName) }}
            </div>
            }
        </div>
        <button (click)="logout()" class="logout-btn" title="Logout">
            <i class="bi bi-power"></i>
            <span class="btn-text">Logout</span>
        </button>
    </div>
</nav>
