<nav class="navbar d-flex justify-content-between align-items-center px-4">

    <div class="d-flex align-items-center gap-3" *ngIf="isSidebarCollapsed || isMobile" style="margin-left: 40px;">
    
        <img src="/assets/logo.svg" alt="Matrutva Little Buds" class="navbar-logo-img">
    
    </div>

    <div *ngIf="!isSidebarCollapsed && !isMobile"></div>

    <div class="d-flex align-items-center gap-3" *ngIf="user$ | async as user">
        <div class="d-none d-md-flex flex-column text-end">
            <span class="fw-bold text-dark small">{{ user.fullName }}</span>
            <span class="badge bg-primary-subtle text-primary rounded-pill role-badge">
                {{ user.roleName }}
            </span>
        </div>
        <div class="avatar-wrapper">
            <img *ngIf="user.profileImageUrl" [src]="user.profileImageUrl" alt="Profile" class="avatar-img">
            <div *ngIf="!user.profileImageUrl" class="avatar-initials">
                {{ getInitials(user.fullName) }}
            </div>
        </div>
        <div class="vr mx-2 d-none d-md-block"></div>
        <button (click)="logout()" class="btn btn-outline-danger btn-sm border-0 rounded-circle">
            <i class="bi bi-box-arrow-right"></i>
        </button>
    </div>
</nav>
