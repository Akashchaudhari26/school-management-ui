<nav class="navbar">
    <div class="navbar-left">
        <button class="hamburger-btn" (click)="onToggleMobile()">
            ☰
        </button>
        <span class="brand-name">Matrutva Little Buds</span>
    </div>

    <div class="navbar-right" *ngIf="user$ | async as user">
        <div class="user-info">
            <span class="user-name">{{ user.fullName }}</span>
            <span class="user-role">{{ user.roleName }}</span>
        </div>
        <div class="avatar">
            <img [src]="user.profileImageUrl || 'assets/default-avatar.png'" alt="User">
        </div>
        <button (click)="logout()" class="logout-btn">Logout</button>
    </div>
</nav>
