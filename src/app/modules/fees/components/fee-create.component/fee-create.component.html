<div class="container-fluid mt-4">
    <div class="card">
        <div class="card-header py-3 bg-primary text-white">
            <h5 class="mb-0"><i class="bi bi-cash-stack me-2"></i>Create Fee Structure</h5>
        </div>

        <div class="card-body p-4">

            <div class="mb-4 p-3 bg-light rounded border">
                <label class="form-label fw-bold text-secondary">Find Student (Optional)</label>
                <div class="input-group">
                    <input type="text" class="form-control" [(ngModel)]="searchKeyword" (keyup.enter)="onSearch()"
                        placeholder="Search by Name or Admission No...">
                    <button class="btn btn-outline-primary" type="button" (click)="onSearch()" [disabled]="isSearching">
                        <span *ngIf="isSearching" class="spinner-border spinner-border-sm"></span>
                        <i *ngIf="!isSearching" class="bi bi-search"></i> Search
                    </button>
                </div>

                <div *ngIf="showResults" class="mt-2 list-group shadow-sm">

                    <div class="list-group-item d-flex justify-content-between align-items-center bg-light">
                        <small class="text-muted">Found {{ searchResults.length }} matches</small>
                        <button class="btn btn-sm btn-close" (click)="closeSearch()"></button>
                    </div>

                    <button *ngFor="let student of searchResults" type="button"
                        class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                        (click)="selectStudent(student)">
                        <div>
                            <strong>{{ student.firstName }} {{ student.lastName }}</strong>
                            <div class="small text-muted">
                                ID: {{ student.admissionNumber }} | Class: {{ student.currentClassId }}
                            </div>
                        </div>
                        <span class="badge bg-success rounded-pill">Select</span>
                    </button>

                    <div *ngIf="searchResults.length === 0 && !isSearching" class="list-group-item text-danger">
                        No students found matching "{{ searchKeyword }}"
                    </div>
                </div>
            </div>
            <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show">
                {{ successMessage }}
                <button type="button" class="btn-close" (click)="successMessage=''"></button>
            </div>

            <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show">
                {{ errorMessage }}
                <button type="button" class="btn-close" (click)="errorMessage=''"></button>
            </div>

            <form [formGroup]="feeForm" (ngSubmit)="onSubmit()">

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Student ID <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" formControlName="studentId"
                            placeholder="e.g. STU-2025-001"
                            [class.is-invalid]="feeForm.get('studentId')?.invalid && feeForm.get('studentId')?.touched">
                        <div class="invalid-feedback">Student ID is required.</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Academic Year <span class="text-danger">*</span></label>
                        <select class="form-select" formControlName="academicYear">
                            <option value="" disabled>Select Year</option>

                            @for (year of academicYears; track year.name) {
                            <option [value]="year.name">
                                {{ year.name }}
                                {{ year.active ? '(Current)' : '' }}
                            </option>
                            }
                        </select>
                    </div>
                </div>

                <hr class="my-4">

                <h6 class="text-muted mb-3">Fee Components</h6>

                <div formArrayName="feeItems">
                    <div *ngFor="let item of feeItems.controls; let i=index" [formGroupName]="i"
                        class="row g-3 align-items-end mb-2">

                        <div class="col-12 col-md-6">
                            <label *ngIf="i===0" class="form-label small text-muted">Fee Head</label>
                            <input type="text" class="form-control" formControlName="name" placeholder="Tuition">
                        </div>

                        <div class="col-8 col-md-4">
                            <label *ngIf="i===0" class="form-label small text-muted">Amount (₹)</label>
                            <input type="number" class="form-control" formControlName="amount" placeholder="0.00">
                        </div>

                        <div class="col-4 col-md-2">
                            <button type="button" class="btn btn-outline-danger w-100" (click)="removeFeeItem(i)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="button" class="btn btn-sm btn-outline-secondary" (click)="addFeeItem()">
                        <i class="bi bi-plus-lg"></i> Add Item
                    </button>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Total: <span class="text-secondary fw-bold">₹ {{ getTotalAmount() }}</span></h5>

                    <button type="submit" class="btn btn-primary px-4">
                        Save Structure
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
