<div class="main-container">

    <div class="page-header">
        <div class="header-content">
            <h2>Staff Directory</h2>
            <p class="subtitle">Manage teachers and employees.</p>
        </div>
        <a routerLink="/dashboard/staff/new" class="btn-primary">
            <i class="bi bi-plus-lg"></i>
            <span>Add New Staff</span>
        </a>
    </div>

    <div class="content-card">

        <div class="toolbar" [formGroup]="filterForm">
            <div class="search-group">
                <div class="search-wrapper">
                    <i class="bi bi-search search-icon"></i>
                    <input formControlName="keyword" (keyup.enter)="onSearch()" type="text" class="search-input"
                        placeholder="Name, Phone, or Code...">
                </div>
            </div>

            <div class="filters-group">
                <select formControlName="staffType" class="filter-select">
                    <option value="">All Roles</option>
                    @for (role of roles | async; track role.value) {
                    <option [value]="role.value">{{ role.label }}</option>
                    }
                </select>

                <select formControlName="designation" class="filter-select">
                    <option value="">All Designations</option>
                    @for (deg of designations | async; track deg.value) {
                    <option [value]="deg.value">{{ deg.label }}</option>
                    }
                </select>

                <div class="filter-actions">
                    <button class="btn-search" (click)="onSearch()">Search</button>
                    <button class="btn-reset" (click)="resetFilters()" title="Reset Filters">
                        <i class="bi bi-arrow-counterclockwise"></i>
                    </button>
                </div>
            </div>
        </div>

        <app-staff-table [staff]="staffList" mode="VIEW" (view)="onView($event)" (edit)="onEdit($event)"
            (delete)="onDelete($event)">
        </app-staff-table>

        <div class="pagination-footer">
            <span class="pagination-info">
                Showing <strong>{{ currentPage * pageSize + 1 }}</strong> to
                <strong>{{ (currentPage + 1) * pageSize > totalElements ? totalElements : (currentPage + 1) * pageSize
                    }}</strong>
                of <strong>{{ totalElements }}</strong>
            </span>
            <div class="pagination-controls">
                <button class="page-btn" [disabled]="currentPage === 0" (click)="onPageChange(currentPage - 1)">
                    <i class="bi bi-chevron-left"></i> Previous
                </button>
                <span class="page-number">Page {{ currentPage + 1 }} of {{ totalPages }}</span>
                <button class="page-btn" [disabled]="currentPage === totalPages - 1"
                    (click)="onPageChange(currentPage + 1)">
                    Next <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>

    </div>
</div>
